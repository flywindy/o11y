name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Review this pin when Go publishes a new 1.25.x security patch.
  # go1.25.13 fixes seven stdlib advisories that go1.25.12 is affected by,
  # including GO-2026-6088 (encoding/xml recursion depth), GO-2026-5972
  # (encoding/asn1 recursion depth), and GO-2026-5026 (x/net/idna Punycode).
  GOVULNCHECK_GOTOOLCHAIN: go1.25.13

jobs:
  test:
    name: test (race + cover)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # Tests run on the Go version declared in go.mod so we exercise
      # exactly the stdlib surface our minimum-supported toolchain ships.
      # govulncheck (in the vuln job below) uses a patched Go 1.25 toolchain
      # so it sees stdlib CVE fixes on our supported Go line.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true

      - name: go build ./...
        run: go build ./...

      - name: go test -race -cover
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: build examples
        run: |
          set -euo pipefail
          # Guard for repos that haven't shipped examples yet — keeps this
          # workflow reusable as a baseline.
          if [ ! -d examples ]; then
            echo "no examples/ directory; skipping"
            exit 0
          fi
          while IFS= read -r main; do
            dir=$(dirname "$main")
            echo "::group::build $dir"
            go build -o /dev/null "./$dir"
            echo "::endgroup::"
          done < <(find examples -name main.go)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false

      # golangci-lint binary version is pinned for CI reproducibility.
      # Manage upgrades via Dependabot / Renovate so they land as PRs
      # rather than silently changing behaviour on every CI run.
      # NOTE: golangci-lint-action@v7 is required for golangci-lint v2.x;
      # the older @v6 line only supports v1.x.
      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa
        with:
          version: v2.11.4
          args: --timeout=5m

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # govulncheck must see a patched Go 1.25 stdlib so vulnerability matches
      # reflect what a freshly-built binary on our supported Go line would link.
      # Use setup-go for cache/path setup, then force the exact patched toolchain
      # through GOTOOLCHAIN because setup-go's 1.25.x manifest can lag releases.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.x'
          check-latest: true
          cache: true

      # govulncheck is pinned for CI reproducibility (format/exit-code
      # changes between releases have broken pipelines historically).
      # Manage upgrades via Dependabot / Renovate.
      - name: govulncheck
        env:
          GOTOOLCHAIN: ${{ env.GOVULNCHECK_GOTOOLCHAIN }}
        run: |
          go version
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...
