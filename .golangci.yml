version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - revive
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose
      - path: examples/
        linters:
          - errcheck
          - revive

formatters:
  enable:
    - gofmt
    - goimports
