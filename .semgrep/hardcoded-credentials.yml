rules:
  - id: hardcoded-credential-literal
    languages: [go]
    severity: ERROR
    message: >
      Hard-coded credential literal. Credentials belong in an environment
      variable, a secret store, or a caller-supplied option — never a string
      literal in source. A fixture credential in a test is the one legitimate
      exception: annotate it with `// nosemgrep: hardcoded-credential-literal`
      (add `// #nosec G101 -- reason` above that too if gosec also reports the
      line — the two suppression mechanisms are independent and each names
      its own rule).
    # Tests are in scope on purpose. A fixture-only credential asserted absent
    # from a redacted/scrubbed output (see internal/redact/redact_test.go) is
    # exactly the shape this rule exists to catch, and gosec's G101 misses it:
    # G101 filters on entropy, and short fixture values like "secret" or
    # "sup3r-s3cret-token" fall under its threshold.
    patterns:
      - pattern-either:
          - pattern: const $NAME = $VAL
          - pattern: var $NAME = $VAL
          - pattern: $NAME := $VAL
          - pattern: $NAME = $VAL
      # Composite-literal fields (ProxyPassword: "proxypass") are out of scope
      # and need no exclusion — a field is not a declaration, so none of the
      # four patterns above reaches one. Deliberate: it is the shape every
      # table-driven test that builds a Config takes, and widening into it
      # would trade one real finding for a very large annotation burden. The
      # fixture asserts the silence so a pattern change that reaches it fails
      # the rule tests.
      - metavariable-regex:
          metavariable: $NAME
          # Must carry a credential word, and must not be the name OF
          # something — a header, cookie, collection or env var holds a
          # protocol constant, not a credential.
          #
          # The exclusions are anchored, not free substrings: those
          # identifiers end in the qualifier (ssoTokenName,
          # ssoTokensCollection, tokenEnvVar) or begin with it
          # (headerAuthToken). An unanchored "name" would also match the
          # middle of usernamePassword and veto a real credential.
          regex: '(?i)^(?!header)(?!.*(?:name|header|cookie|collection|prefix|envvar)$).*(?:passwd|password|pwd|secret|token|apikey|credential).*$'
      - metavariable-regex:
          metavariable: $VAL
          # A non-empty string literal, interpreted or raw, optionally
          # concatenated with more of the same via "+" ("sup3r-" + "secret"
          # is exactly as hard-coded as one literal, just split to dodge a
          # naive single-literal check). Anything else — a call, an
          # identifier, "" — is not a hard-coded credential. No entropy
          # filter: gosec's G101 has one, and it is why low-entropy values
          # like "secret" reach source unreported by gosec alone.
          regex: '^("(\\.|[^"\\])+"|`[^`]+`)(\s*\+\s*("(\\.|[^"\\])+"|`[^`]+`))*$'
