<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nats-ws-browser — o11y example</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: 'Courier New', monospace;
      max-width: 820px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      background: #0d1117;
      color: #c9d1d9;
    }
    h1 { color: #58a6ff; margin-bottom: .25rem; }
    p { margin: 0 0 1.25rem; color: #8b949e; font-size: .9rem; line-height: 1.6; }
    a { color: #58a6ff; }

    #status {
      display: inline-block;
      padding: .2rem .8rem;
      border-radius: 999px;
      font-size: .8rem;
      font-weight: bold;
      margin-bottom: 1.25rem;
    }
    #status.connected    { background: #1a3d1a; color: #3fb950; border: 1px solid #3fb950; }
    #status.disconnected { background: #3d1a1a; color: #f85149; border: 1px solid #f85149; }
    #status.connecting   { background: #2d2a1a; color: #d29922; border: 1px solid #d29922; }

    .controls { display: flex; gap: .5rem; margin-bottom: 1.25rem; }
    input[type="text"] {
      flex: 1;
      padding: .5rem .75rem;
      background: #161b22;
      border: 1px solid #30363d;
      color: #c9d1d9;
      border-radius: 6px;
      font-family: inherit;
      font-size: .9rem;
    }
    button {
      padding: .5rem 1.25rem;
      background: #1f6feb;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: .9rem;
      white-space: nowrap;
    }
    button:disabled { opacity: .4; cursor: not-allowed; background: #30363d; }
    button:not(:disabled):hover { background: #388bfd; }

    h2 { font-size: .85rem; color: #8b949e; text-transform: uppercase; letter-spacing: .08em; margin: 0 0 .5rem; }
    #log {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 420px;
      overflow-y: auto;
      border: 1px solid #21262d;
      border-radius: 6px;
      background: #161b22;
    }
    #log li {
      padding: .35rem .75rem;
      border-bottom: 1px solid #21262d;
      font-size: .8rem;
      line-height: 1.5;
    }
    #log li:last-child { border-bottom: none; }
    #log li .ts  { color: #484f58; margin-right: .5rem; }
    #log li.sent     { color: #79c0ff; }
    #log li.received { color: #56d364; }
    #log li.error    { color: #f85149; }
    #log li.info     { color: #8b949e; }
    #log li .trace   { font-size: .72rem; color: #484f58; margin-left: .5rem; }
  </style>
</head>
<body>
  <h1>nats-ws-browser</h1>
  <p>
    Browser publishes to NATS via WebSocket. The Go backend receives the message,
    creates a child span linked to the browser's trace, and replies.<br>
    View the distributed trace in
    <a href="http://localhost:3000" target="_blank" rel="noopener">Grafana → Explore → Tempo</a>.
  </p>

  <div id="status" class="disconnected">Disconnected</div>

  <div class="controls">
    <input id="message-input" type="text" placeholder="payload…" value="hello from browser" />
    <button id="publish-btn" disabled>Publish</button>
  </div>

  <h2>Event log</h2>
  <ul id="log"></ul>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
