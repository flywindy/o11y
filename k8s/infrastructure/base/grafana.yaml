apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: infra
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      url: http://tempo.infra.svc.cluster.local:3200
      isDefault: false
      jsonData:
        nodeGraph:
          enabled: true
        search:
          hide: false
        lokiSearch:
          datasourceUid: loki
        serviceMap:
          datasourceUid: prometheus
        tracesToLogsV2:
          datasourceUid: loki
          # customQuery provides the trace filter, so keep Grafana's built-in trace ID filter disabled.
          filterByTraceID: false
          filterBySpanID: false
          spanStartTimeShift: '-5m'
          spanEndTimeShift: '5m'
          tags:
            - key: service.name
              value: service_name
          customQuery: true
          query: '{service_name=~"(.*/|)$${__span.tags["service.name"]}"} |= "$${__trace.traceId}"'

    - name: Prometheus
      type: prometheus
      uid: prometheus
      access: proxy
      url: http://prometheus.infra.svc.cluster.local:9090
      jsonData:
        # exemplarTraceIdDestinations wires histogram exemplars to Tempo:
        # clicking an exemplar dot in Grafana opens the linked trace directly.
        exemplarTraceIdDestinations:
          - name: trace_id
            datasourceUid: tempo

    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.infra.svc.cluster.local:3100
      jsonData:
        derivedFields:
          - datasourceUid: tempo
            # Two log paths produce different field names:
            # - OTLP path (App → OTel Collector → Loki): Loki exporter flattens
            #   OTLP TraceID to "traceid" (all lowercase).
            # - Alloy/stdout path (App stdout → Alloy → OTel Collector → Loki):
            #   raw JSON body is preserved with "traceId" (camelCase from slog).
            # The character class [Ii] matches both.
            matcherRegex: '"trace[Ii]d"\s*:\s*"([0-9a-f]{32})"'
            name: TraceID
            url: "$${__value.raw}"
            internal: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-providers
  namespace: infra
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: o11y
        orgId: 1
        folder: Observability
        type: file
        disableDeletion: true
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: infra
data:
  metrics-correlation.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "showPoints": "never"
              },
              "links": [
                {
                  "targetBlank": true,
                  "title": "Open metrics-example logs in Loki",
                  "url": "/explore?schemaVersion=1&orgId=1&panes=%7B%22metricsLogs%22%3A%7B%22datasource%22%3A%22loki%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22datasource%22%3A%7B%22type%22%3A%22loki%22%2C%22uid%22%3A%22loki%22%7D%2C%22expr%22%3A%22%7Bservice_name%3D%5C%22platform%2Fmetrics-example%5C%22%7D%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22${__from}%22%2C%22to%22%3A%22${__to}%22%7D%7D%7D"
                }
              ],
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum by (le, job, http_route, http_response_status_code) (rate(http_server_request_duration_seconds_bucket{job=\"platform/metrics-example\"}[5m])))",
              "legendFormat": "{{http_route}} {{http_response_status_code}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "HTTP request latency p95",
          "type": "timeseries"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": [
        "o11y",
        "metrics",
        "logs"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "Metrics Correlation",
      "uid": "metrics-correlation",
      "version": 1,
      "weekStart": ""
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:11.6.0
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: grafana-datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: grafana-dashboard-providers
          mountPath: /etc/grafana/provisioning/dashboards
        - name: grafana-dashboards
          mountPath: /var/lib/grafana/dashboards
      volumes:
      - name: grafana-datasources
        configMap:
          name: grafana-datasources
      - name: grafana-dashboard-providers
        configMap:
          name: grafana-dashboard-providers
      - name: grafana-dashboards
        configMap:
          name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: infra
spec:
  selector:
    app: grafana
  ports:
  - port: 3000
    targetPort: 3000
