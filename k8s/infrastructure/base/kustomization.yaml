apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - nats.yaml
  - mongodb.yaml
  - tempo.yaml
  - loki.yaml
  - pyroscope.yaml
  - alloy.yaml
  - otel-collector.yaml
  - prometheus.yaml
  - grafana.yaml

# Generate the grafana-dashboards ConfigMap from standalone JSON files so
# dashboard definitions live as proper files (no YAML escaping, easy diffs)
# while still being delivered to the cluster as a single mountable ConfigMap.
#
# The default name-suffix hash is intentional: every edit to a dashboard JSON
# changes the generated ConfigMap's name, and kustomize rewrites the
# Deployment's volume reference (k8s/infrastructure/base/grafana.yaml) to the
# new name so the rollout picks up dashboard updates automatically.
configMapGenerator:
  - name: grafana-dashboards
    namespace: infra
    files:
      - dashboards/o11y-overview.json
      - dashboards/metrics-correlation.json
