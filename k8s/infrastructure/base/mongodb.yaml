apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
  namespace: infra
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:8.0.20
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
      volumes:
      - name: mongodb-data
        persistentVolumeClaim:
          claimName: mongodb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: infra
spec:
  selector:
    app: mongodb
  ports:
  - port: 27017
    targetPort: 27017
---
# NodePort exposing MongoDB to the host so examples/mongodb can connect via
# mongodb://localhost:27017 without a port-forward (kind-config.yaml maps
# node:30003 → host:27017).
apiVersion: v1
kind: Service
metadata:
  name: mongodb-nodeport
  namespace: infra
spec:
  type: NodePort
  selector:
    app: mongodb
  ports:
  - name: mongo
    port: 27017
    targetPort: 27017
    nodePort: 30003
