apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-conf
  namespace: infra
data:
  nats.conf: |
    http_port: 8222

    jetstream: enabled

    websocket {
      port: 4223
      no_tls: true
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: infra
spec:
  serviceName: "nats"
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
      - name: nats
        image: nats:2.12.6
        args: ["-c", "/etc/nats/nats.conf"]
        ports:
        - containerPort: 4222
          name: client
        - containerPort: 4223
          name: websocket
        - containerPort: 8222
          name: monitor
        volumeMounts:
        - name: nats-conf
          mountPath: /etc/nats/nats.conf
          subPath: nats.conf
      volumes:
      - name: nats-conf
        configMap:
          name: nats-conf
---
# Internal service: Go clients use 4222 (TCP), WebSocket is cluster-internal via 4223.
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: infra
spec:
  type: ClusterIP
  selector:
    app: nats
  ports:
  - name: client
    port: 4222
  - name: websocket
    port: 4223
  - name: monitor
    port: 8222
---
# Dedicated NodePort service to expose only the WebSocket port to the host.
apiVersion: v1
kind: Service
metadata:
  name: nats-websocket
  namespace: infra
spec:
  type: NodePort
  selector:
    app: nats
  ports:
  - name: websocket
    port: 4223
    targetPort: 4223
    nodePort: 30001
---
# Dedicated NodePort exposing the NATS TCP client port to the host so the
# examples can connect via nats://localhost:4222 without a port-forward
# (kind-config.yaml maps node:30002 → host:4222).
apiVersion: v1
kind: Service
metadata:
  name: nats-client
  namespace: infra
spec:
  type: NodePort
  selector:
    app: nats
  ports:
  - name: client
    port: 4222
    targetPort: 4222
    nodePort: 30002
