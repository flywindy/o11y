apiVersion: apps/v1
kind: Deployment
metadata:
  name: pyroscope
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pyroscope
  template:
    metadata:
      labels:
        app: pyroscope
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: pyroscope
        image: grafana/pyroscope:2.0.2
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 4040
          name: http
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 60
          periodSeconds: 20
        volumeMounts:
        - name: pyroscope-data
          mountPath: /var/lib/pyroscope
        - name: pyroscope-tmp
          mountPath: /tmp
      volumes:
      - name: pyroscope-data
        # Local kind storage only; production overlays should replace this with a PVC.
        emptyDir: {}
      - name: pyroscope-tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pyroscope
  namespace: infra
spec:
  selector:
    app: pyroscope
  ports:
  - name: http
    port: 4040
    targetPort: http
