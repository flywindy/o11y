apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/monitor

# Uncomment the resources you need for the examples you want to run:
#
#   nats          → examples/nats-core, examples/jetstream, examples/nats-ws-browser
#   mongodb       → examples/mongodb
#   redis         → examples/redis
#   minio         → examples/minio
#   elasticsearch → examples/elasticsearch
#   cassandra     → examples/cassandra
#
#  - ../../base/components/nats
#  - ../../base/components/mongodb
#  - ../../base/components/redis
#  - ../../base/components/minio
#  - ../../base/components/elasticsearch
#  - ../../base/components/cassandra

images:
  - name: grafana/tempo
    newName: internal-registry.example.com/grafana/tempo
  - name: otel/opentelemetry-collector-contrib
    newName: internal-registry.example.com/otel/opentelemetry-collector-contrib
  - name: nats
    newName: internal-registry.example.com/nats
  - name: mongo
    newName: internal-registry.example.com/mongo
  - name: grafana/loki
    newName: internal-registry.example.com/grafana/loki
  - name: grafana/grafana
    newName: internal-registry.example.com/grafana/grafana
  - name: grafana/alloy
    newName: internal-registry.example.com/grafana/alloy
  - name: prom/prometheus
    newName: internal-registry.example.com/prom/prometheus
  - name: quay.io/minio/minio
    newName: internal-registry.example.com/minio/minio
  - name: redis
    newName: internal-registry.example.com/redis
  - name: grafana/pyroscope
    newName: internal-registry.example.com/grafana/pyroscope
  - name: docker.elastic.co/elasticsearch/elasticsearch
    newName: internal-registry.example.com/elasticsearch/elasticsearch
  - name: cassandra
    newName: internal-registry.example.com/cassandra
